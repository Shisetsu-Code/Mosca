name: cpu-profile

on:
  push:
    branches:
      - exp/cpu-profile
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - name: Profile transfer hot path
        run: >-
          python -m cProfile -s cumulative -m mosca.cli
          transfer-benchmark
          --pretrain-episodes 150
          --adapt-episodes 80
          --seed 0
