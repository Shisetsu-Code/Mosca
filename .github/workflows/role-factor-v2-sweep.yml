name: role-factor-v2-sweep

on:
  push:
    branches:
      - exp/role-factor-v2
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        role_mix: [0.0, 0.15, 0.30, 0.50]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 600
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --role-factor-mix ${{ matrix.role_mix }}
