name: group-factor-sweep

on:
  push:
    branches:
      - exp/group-factor-routing
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        agg_factor_mix: [0.0, 0.75]
        filter_factor_mix: [0.0, 0.75]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 600
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --factor-mix 0.0
          --agg-factor-mix ${{ matrix.agg_factor_mix }}
          --filter-factor-mix ${{ matrix.filter_factor_mix }}
