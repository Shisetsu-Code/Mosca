name: concept-mix-sweep

on:
  push:
    branches:
      - exp/concept-mix-sweep
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        concept_mix: [0.45, 0.75, 1.0, 1.5]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca concept-zero-shot
          --pretrain-episodes 600
          --seed ${{ matrix.seed }}
          --concept-mix ${{ matrix.concept_mix }}
