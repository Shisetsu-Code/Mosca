name: role-filterall-v3-sweep

on:
  push:
    branches:
      - exp/role-filterall-v3
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, roles, roles_filter25, roles_filter50]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - name: baseline
        if: matrix.mode == 'baseline'
        run: >-
          mosca transfer-suite --pretrain-episodes 600 --adapt-episodes 250
          --seeds ${{ matrix.seed }} --role-factor-mix 0.0
          --filter-all-factor-mix 0.0
      - name: roles
        if: matrix.mode == 'roles'
        run: >-
          mosca transfer-suite --pretrain-episodes 600 --adapt-episodes 250
          --seeds ${{ matrix.seed }} --role-factor-mix 0.30
          --filter-all-factor-mix 0.0
      - name: roles + filter-all 0.25
        if: matrix.mode == 'roles_filter25'
        run: >-
          mosca transfer-suite --pretrain-episodes 600 --adapt-episodes 250
          --seeds ${{ matrix.seed }} --role-factor-mix 0.30
          --filter-all-factor-mix 0.25
      - name: roles + filter-all 0.50
        if: matrix.mode == 'roles_filter50'
        run: >-
          mosca transfer-suite --pretrain-episodes 600 --adapt-episodes 250
          --seeds ${{ matrix.seed }} --role-factor-mix 0.30
          --filter-all-factor-mix 0.50
