name: role-filterall-v3-sweep

on:
  push:
    branches:
      - exp/role-filterall-v3
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            role_mix: 0.0
            filter_all_mix: 0.0
          - mode: roles
            role_mix: 0.30
            filter_all_mix: 0.0
          - mode: roles_filter25
            role_mix: 0.30
            filter_all_mix: 0.25
          - mode: roles_filter50
            role_mix: 0.30
            filter_all_mix: 0.50
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 600
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --role-factor-mix ${{ matrix.role_mix }}
          --filter-all-factor-mix ${{ matrix.filter_all_mix }}
