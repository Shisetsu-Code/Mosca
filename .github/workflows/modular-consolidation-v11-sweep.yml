name: modular-consolidation-v11-sweep

on:
  push:
    branches:
      - exp/modular-consolidation-v11
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        mastery: [20, 40, 80]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca modular-transfer-suite
          --core-pretrain-episodes 600
          --module-max-episodes 600
          --module-target-visible ${{ matrix.mastery }}
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --filter-factor-mix 0.25
