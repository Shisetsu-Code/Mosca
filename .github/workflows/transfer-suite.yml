name: transfer-suite

on:
  push:
    branches:
      - exp/transfer-suite
      - exp/semantic-memory-only
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 600
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
