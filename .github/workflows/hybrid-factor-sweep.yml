name: hybrid-factor-sweep

on:
  push:
    branches:
      - exp/hybrid-factor-memory
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        factor_mix: [0.0, 0.25, 0.5, 0.75, 1.0]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 600
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --factor-mix ${{ matrix.factor_mix }}
