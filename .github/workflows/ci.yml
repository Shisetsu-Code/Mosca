name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: mosca runtime
      - run: mosca rules
      - run: mosca worlds
      - run: mosca ast-reference all
      - run: mosca solve sum_list --depth 7
      - run: mosca solve count_positive --depth 9
      - run: mosca solve max_list --depth 9
      - run: mosca benchmark --episodes 50 --seed 42

      - run: mosca motor-reference all
      - run: mosca motor-benchmark --episodes 300 --seed 42 --require-fly-solved --require-fly-generalized

      - run: mosca motor-multiseed --episodes 75 --seeds 0,1,2
      - run: mosca transfer-benchmark --pretrain-episodes 900 --adapt-episodes 300 --seed 42
      - run: mosca transfer-multiseed --pretrain-episodes 600 --adapt-episodes 250 --seeds 0,1,2,3,4
      - run: mosca mcts-benchmark --simulations 500 --seed 42
      - run: mosca mcts-multiseed --simulations 500 --seeds 0,1,2,3,4
      - run: mosca transfer-suite --pretrain-episodes 10 --adapt-episodes 3 --seeds 0 --source-curriculum expanded
      - run: mosca motor-benchmark --episodes 80 --seed 42 --world mosca
      - run: mosca transfer-suite --pretrain-episodes 12 --adapt-episodes 4 --seeds 0 --world mosca
      - run: mosca motor-benchmark --episodes 80 --seed 42 --world compact
      - run: mosca mcts-benchmark --simulations 120 --seed 42 --world compact
      - run: mosca motor-benchmark --episodes 80 --seed 42 --world compact2
      - run: mosca mcts-benchmark --simulations 120 --seed 42 --world compact2
