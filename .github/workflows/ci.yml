name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: mosca runtime
      - run: mosca rules
      - run: mosca ast-reference all
      - run: mosca solve sum_list --depth 7
      - run: mosca solve count_positive --depth 9
      - run: mosca solve max_list --depth 9
      - run: mosca benchmark --episodes 50 --seed 42

      - run: mosca motor-reference all
      - run: mosca motor-benchmark --episodes 300 --seed 42 --require-fly-solved --require-fly-generalized

      - run: mosca motor-multiseed --episodes 75 --seeds 0,1,2
      - run: mosca transfer-benchmark --pretrain-episodes 900 --adapt-episodes 300 --seed 42
      - run: mosca transfer-multiseed --pretrain-episodes 600 --adapt-episodes 250 --seeds 0,1,2,3,4
