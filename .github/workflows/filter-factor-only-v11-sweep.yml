name: filter-factor-only-v11-sweep

on:
  push:
    branches:
      - exp/filter-factor-only-v11
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        filter_mix: [0.0, 0.05, 0.10, 0.15]
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e .[dev]
      - run: >-
          mosca transfer-suite
          --pretrain-episodes 1000
          --adapt-episodes 250
          --seeds ${{ matrix.seed }}
          --source-curriculum expanded
          --filter-factor-mix ${{ matrix.filter_mix }}
